paths:
  /admin/promote_user:
    <<: *commonOptionsPOST
    post:
      tags: [Admin]
      summary: Ensure the signed-in admin's users row (by Cognito sub)
      description: >
        Finds, links or creates the caller's own users row, keyed on the
        Cognito sub from the admin authorizer, and sets its role to admin.
        Acts only on the caller; every request body field is ignored.
      operationId: admin_update_user
      security:
        - adminAuthorizer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Deprecated and ignored.
                email:
                  type: string
                  description: Deprecated and ignored (the authorizer's Cognito email is used).
                role:
                  type: string
                  enum: [student, admin]
                  description: Deprecated and ignored (always admin).
      responses:
        "200":
          description: Updated user
        "400":
          description: Bad Request (invalid JSON body)
        "401":
          description: Unauthorized (no Cognito sub in the authorizer context)
        "403":
          description: Admin access required
        "404":
          description: User not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /admin/users:
    <<: *commonOptionsGETPOST
    get:
      tags:
        - Admin
      summary: Get system users
      operationId: get_admin_users
      security:
        - adminAuthorizer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of users
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy
    post:
      tags:
        - Admin
      summary: Create an administrator
      description: >
        Creates the Cognito user (Cognito emails a temporary password), adds it
        to the "admin" group and writes its admin users row. An email that
        already has a Cognito account is added to the admin group and its row
        elevated (200). Served by adminProvisioningFunction, the only request
        handler allowed to call Cognito admin APIs.
      operationId: create_admin_user
      security:
        - adminAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - display_name
                - email
              properties:
                display_name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        "201":
          description: Admin user created and invited
          content:
            application/json:
              schema: &adminUserProvisioned
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  display_name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    example: "admin"
                  cognito:
                    type: string
                    enum: [created, existing]
        "200":
          description: Existing Cognito account added to the admin group
          content:
            application/json:
              schema: *adminUserProvisioned
        "400":
          description: Invalid display_name or email, or email domain not allowed
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminProvisioningFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy
      x-amazon-apigateway-request-validator: all

  /admin/users/{userId}/chat_sessions:
    <<: *commonOptionsGET
    get:
      tags:
        - Admin
      summary: Get chat sessions for a specific user
      operationId: get_admin_user_chat_sessions
      security:
        - adminAuthorizer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of chat sessions
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /admin/chat_sessions/{sessionId}/messages:
    <<: *commonOptionsGET
    get:
      tags:
        - Admin
      summary: Get messages for a specific chat session
      operationId: get_admin_chat_session_messages
      security:
        - adminAuthorizer: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of chat messages
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /admin/feedback/{chat_session_id}/message:
    <<: *commonOptionsGET
    get:
      tags:
        - Admin
      summary: Get only the assistant reply a conversation's feedback was left on
      description: >-
        Returns { message, inferred }. message is null if no reply is found.
        inferred is true for older feedback saved before the reply was linked,
        where the last reply before the feedback is used instead.
      operationId: get_admin_feedback_message
      security:
        - adminAuthorizer: []
      parameters:
        - name: chat_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The rated assistant reply
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Feedback not found
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /admin/feedback/{chat_session_id}:
    <<: *commonOptionsPUT
    put:
      tags:
        - Admin
      summary: Star or dismiss a conversation's feedback (shared by all admins)
      description: >-
        Dismissing also removes the star. Dismissed feedback still counts in
        analytics totals. The response never includes the comment text.
      operationId: put_admin_feedback_triage
      security:
        - adminAuthorizer: []
      parameters:
        - name: chat_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                starred:
                  type: boolean
                dismissed:
                  type: boolean
      responses:
        "200":
          description: Updated triage state ({ chat_session_id, starred, dismissed })
        "400":
          description: Invalid id or body
        "401":
          description: Unauthorized
        "404":
          description: Feedback not found
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /admin/data_sources:
    <<: *commonOptionsGETPOST
    get:
      tags: [Admin]
      summary: List data sources with latest ingestion run
      operationId: get_admin_data_sources
      security:
        - adminAuthorizer: []
      responses:
        "200":
          description: Data sources with latest ingestion run per source
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        data_source:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type:
                              type: string
                              enum:
                                [website, csv, markdown, json, video, document]
                            created_at: { type: string }
                            metadata:
                              type: object
                              additionalProperties: true
                            include_patterns:
                              type: array
                              nullable: true
                              items: { type: string }
                            exclude_patterns:
                              type: array
                              nullable: true
                              items: { type: string }
                        latest_ingestion_run:
                          nullable: true
                          type: object
                          properties:
                            id: { type: string }
                            data_source_id: { type: string }
                            status:
                              type: string
                              enum:
                                [pending, queued, running, failed, completed]
                            error_message:
                              type: string
                              nullable: true
                            created_at: { type: string }
                            completed_at:
                              type: string
                              nullable: true
      "401":
        description: Unauthorized
      "500":
        description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminFunction.Arn}/invocations
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy
    post:
      tags: [Admin]
      summary: Stage data sources for future syncing
      operationId: add_data_sources
      security:
        - adminAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - created_by
              properties:
                type:
                  type: string
                  enum: [website, csv, markdown, video, document]
                  example: website
                created_by:
                  type: string
                  example: example@email.com
                name:
                  type: string
                  description: >-
                    For type website: the crawl seed. Must be a public http(s) URL (no
                    embedded credentials, ports 80/443/8080/8443, host must resolve only
                    to public addresses); stored normalized.
                  example: https://example.com
                include_patterns:
                  type: array
                  items:
                    type: string
                exclude_patterns:
                  type: array
                  items:
                    type: string
                csv_file_name:
                  type: string
                  example: alumni_data_final.csv
                csv_s3_bucket:
                  type: string
                  example: my-kb-bucket
                csv_s3_key:
                  type: string
                  example: uploads/csv/1712345678_alumni_data_final.csv
                metadata_file_name:
                  type: string
                  example: alumni_data_final.csv.metadata.json
                metadata_s3_bucket:
                  type: string
                  example: my-kb-bucket
                metadata_s3_key:
                  type: string
                  example: uploads/json/1712345678_alumni_data_final.csv.metadata.json
                url_column:
                  type: string
                  description: >-
                    CSV only. Column whose http(s) links are fetched (HTML/PDF) and
                    indexed with the row's other columns as metadata. Omit to ingest
                    the CSV without crawling links.
                  example: website
                row_id_column:
                  type: string
                  description: >-
                    CSV only, with url_column. Column that identifies a row across
                    re-uploads; defaults to a hash of the whole row.
                  example: id
                title_column:
                  type: string
                  description: CSV only, with url_column. Human-readable resource title column.
                  example: title
                description_column:
                  type: string
                  description: >-
                    CSV only, with url_column. Resource description column; prepended
                    to fetched content for row-specific retrieval.
                  example: description
                citation_column:
                  type: string
                  description: >-
                    CSV only, with url_column. Public http(s) URL shown in citations;
                    invalid or blank values safely fall back to the fetched URL.
                  example: public_url
                video_file_name:
                  type: string
                  example: family-rights-webinar.mp4
                video_s3_bucket:
                  type: string
                video_s3_key:
                  type: string
                  example: uploads/video/1712345678_family-rights-webinar.mp4
                video_url:
                  type: string
                  description: >-
                    Required when type is video. Public http(s) URL used for citations and
                    deep-links; must not point to a private or reserved address.
                  example: https://www.youtube.com/watch?v=example
                document_file_name:
                  type: string
                  example: family-rights-handbook.pdf
                document_s3_bucket:
                  type: string
                  example: my-kb-bucket
                document_s3_key:
                  type: string
                  example: uploads/document/1712345678_family-rights-handbook.pdf
                document_url:
                  type: string
                  description: >-
                    Required when type is document. Public http(s) URL where users can
                    open the document; shown as its citation link. Must not point to a
                    private or reserved address.
                  example: https://example.com/family-rights-handbook.pdf
      responses:
        "200":
          description: >-
            Data source(s) staged successfully. A csv/markdown/document/video file
            uploaded under the same name as an existing source replaces it in place
            (action starts with "replaced_"); a byte-identical re-upload is not
            re-processed (action "unchanged" or "unchanged_*").
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  action:
                    type: string
                  type:
                    type: string
                    enum: [website, csv, markdown, video, document]
                  created_by:
                    type: string
                  staged_data_source_ids:
                    type: array
                    items:
                      type: string
                  suggested_url_column:
                    type: string
                    nullable: true
                    description: >-
                      CSV only: a column where more than 80% of sampled values are
                      http(s) URLs. A hint for setting url_column; nothing is crawled
                      unless url_column is set.
        "400":
          description: >-
            Invalid request, including a website name, video_url or document_url
            that is not a public http(s) URL
        "404":
          description: Route not found
        "409":
          description: >-
            Conflict (website already exists, file already staged, the source it would
            replace is still being ingested, or a search-index cutover is in progress).
            During a cutover the body is {"error": "...", "code": "CUTOVER_LOCKED"}.
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaKnowledgeBase.Arn}/invocations
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy

  /admin/data_sources/sync:
    <<: *commonOptionsPOST
    post:
      tags: [Admin]
      summary: Queue pending data sources and begin syncing
      operationId: sync_data_sources
      security:
        - adminAuthorizer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                created_by:
                  type: string
                  example: example@email.com
      responses:
        "200":
          description: Sync process started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  action:
                    type: string
                  sync_session_id:
                    type: string
                  queued_count:
                    type: integer
                  s3_queued_count:
