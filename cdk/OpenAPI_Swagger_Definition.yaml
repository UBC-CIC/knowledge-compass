  # Embedding spaces (migrations 032 and 033; lambda/knowledgeBase/helpers/embedding_admin.py).
  # A space is one embedding model + dimension + version. A new one is built next to the
  # live one by async jobs, validated, then activated by moving a single pointer.
  # Every POST that does work returns 202 and a job id; poll GET /admin/embedding-jobs/{id}.
  # Responses carry ids, counts and metrics only, never chunk text.
  /admin/embedding-models:
    <<: *commonOptionsGET
    get:
      tags: [Admin]
      summary: List the embedding models this app can call, with the id and call target from Amazon Bedrock
      operationId: get_embedding_models
      security:
        - adminAuthorizer: []
      responses:
        "200":
          description: One entry per supported embedding model
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          {
                            type: string,
                            enum: [cohere_v3, titan_v2, cohere_v4],
                          }
                        label: { type: string }
                        dimensions:
                          type: array
                          items: { type: integer }
                        available: { type: boolean }
                        model_id: { type: string, nullable: true }
                        invoke_target:
                          type: string
                          nullable: true
                          description: Bedrock model id, or an inference profile ARN when the model is not on demand in this region
                        cross_region:
                          type: boolean
                          description: True when calling the model may process text outside this region
                        unavailable_reason: { type: string, nullable: true }
        "401":
          description: Unauthorized
        "503":
          description: Amazon Bedrock could not be asked which models are available
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaKnowledgeBase.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

