openapi: 3.0.0
info:
  title: KC API
  description: Knowledge Compass API
  version: 1.0.0
tags:
  - name: User
    description: endpoints accessible by the general public
  - name: Admin
    description: endpoints accessible by admins
x-amazon-apigateway-request-validators:
  all:
    validateRequestParameters: true
    validateRequestBody: true
  params-only:
    validateRequestParameters: true
    validateRequestBody: false
x-amazon-apigateway-request-validator: params-only
x-amazon-apigateway-gateway-responses:
  UNAUTHORIZED:
    statusCode: "401"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,PUT,POST,DELETE'"
      gatewayresponse.header.Access-Control-Allow-Origin: "stageVariables.allowedOrigin"
    responseTemplates:
      application/json: '{"message":"Unauthorized"}'
  WAF_FILTERED:
    statusCode: "429"
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "stageVariables.allowedOrigin"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,PUT,POST,DELETE'"
    responseTemplates:
      application/json: '{"error":"Rate limit exceeded. Please wait a few minutes before chatting again."}'
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "stageVariables.allowedOrigin"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,PUT,POST,DELETE'"
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "stageVariables.allowedOrigin"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,PUT,POST,DELETE'"
# OPTIONS preflight is a mock integration, so its CORS headers cannot read the request
# origin. Access-Control-Allow-Origin is the stage variable allowedOrigin (the deployed
# SPA origin). Access-Control-Allow-Methods lists only the methods that path serves;
# YAML merge cannot override a nested key, so each method set has its own anchor.
x-common-options-delete: &commonOptionsDELETE
  options:
    summary: CORS support
    description: |
      Enable CORS by returning correct headers
    responses:
      200:
        $ref: "#/components/responses/Success"
    x-amazon-apigateway-integration:
      type: mock
      requestTemplates:
        application/json: |
          {
            "statusCode" : 200
