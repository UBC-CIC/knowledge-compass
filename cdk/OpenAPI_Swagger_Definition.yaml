        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${chatSessionFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /chat_sessions:
    <<: *commonOptionsPOST
    post:
      tags:
        - ChatSessions
      summary: Create a new chat session for a user
      operationId: create_chat_session
      security:
        - userAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: User UUID (guest/student user)
                title:
                  type: string
                  nullable: true
                  description: Optional chat title
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: false
                  maxProperties: 0
                  description: >-
                    No client-settable keys are currently accepted. Server-managed
                    keys (journey_state, guide_state, routing) and unknown keys are
                    rejected with 400; null or omitted stores an empty object. The
                    serialised size limit is 2048 bytes.
                eval:
                  type: object
                  nullable: true
                  description: >-
                    Optional evaluation-harness tag (evals/, migration 035). Verified
                    server-side with an HMAC over userId.run_id.mode.exp using the
                    EvalStack signing secret. A valid tag marks the session as test
                    traffic (excluded from admin analytics) and sets its prompt mode;
                    an invalid or unverifiable tag is ignored and a normal session is
                    created. Never echoed in the response.
                  properties:
                    run_id:
                      type: string
                      pattern: "^[A-Za-z0-9_-]{1,64}$"
                    mode:
                      type: string
                      enum: [standard, guideline]
                    exp:
                      type: integer
                      description: Expiry, epoch seconds (at most 24 hours ahead)
                    sig:
                      type: string
                      description: Lowercase hex HMAC-SHA256
      responses:
        "201":
          description: Chat session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  user_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  last_active_at:
                    type: string
                    format: date-time
                  metadata:
                    type: object
                    nullable: true
        "400":
          description: Invalid request (malformed JSON or invalid metadata)
        "404":
          description: User not found
        "401":
          description: Unauthorized
        "429":
          description: >-
            The user already created 20 chat sessions this UTC day
            (DAILY_SESSION_LIMIT_EXCEEDED). Deleting a session does not free a
            slot; existing sessions can still be used.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [DAILY_SESSION_LIMIT_EXCEEDED]
                  message:
                    type: string
                  session_usage:
                    type: object
                    properties:
                      limit:
                        type: integer
                      reset_at:
                        type: string
                        format: date-time
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${chatSessionFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

components:
  securitySchemes:
    adminAuthorizer:
      type: "apiKey"
      name: "Authorization"
      in: "header"
      x-amazon-apigateway-authtype: "custom"
      x-amazon-apigateway-authorizer:
        type: token
        authorizerUri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${adminLambdaAuthorizer.Arn}/invocations
        identitySource: method.request.header.Authorization

    userAuthorizer:
      type: "apiKey"
      name: "Authorization"
      in: "header"
      x-amazon-apigateway-authtype: "custom"
      x-amazon-apigateway-authorizer:
        type: token
        authorizerUri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${userLambdaAuthorizer.Arn}/invocations
        authorizerResultTtlInSeconds: 300
        identitySource: method.request.header.Authorization
  responses:
    Success:
      description: Request success
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
        Access-Control-Allow-Methods:
          schema:
            type: string
        Access-Control-Allow-Headers:
          schema:
            type: string
      content: {}
