        type: aws_proxy

  /admin/embedding-spaces/{id}/purge:
    <<: *commonOptionsPOST
    post:
      tags: [Admin]
      summary: Permanently delete a retired space's vectors and search index (manual only, after 30 days)
      description: >-
        Never runs automatically. The server refuses an active, building, validated or
        already purged space, a space retired less than 30 days ago (the database clock
        decides), a space while a cutover holds the lock or a job is queued or running for
        it, and a request whose confirm_name is not exactly the space name (case-sensitive).
        The work is idempotent and resumable: if a request dies half way, send it again.
      operationId: purge_embedding_space
      security:
        - adminAuthorizer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name:
                  type: string
                  description: The exact name of the space, typed by the administrator
      responses:
        "200":
          description: Space purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  status: { type: string, enum: [purged] }
                  deleted_vectors: { type: integer }
        "400":
          description: Invalid id, or confirm_name is missing or does not match the space name
        "401":
          description: Unauthorized
        "404":
          description: Space not found
        "409":
          description: >-
            The space is active, not retired, already purged, retired less than 30 days ago
            (purge_eligible_at is returned), a job is running for it, or the cutover lock is
            held (code CUTOVER_LOCKED)
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaKnowledgeBase.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

