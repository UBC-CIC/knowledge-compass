  /user/publicToken:
    options:
      summary: CORS support
      description: Enable CORS by returning correct headers
      responses:
        200:
          $ref: "#/components/responses/Success"
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: |
            {
              "statusCode" : 200
            }
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "stageVariables.allowedOrigin"
            responseTemplates:
              application/json: |
                {}
    get:
      tags:
        - Public
      summary: Get a 15-minute access token for an anonymous user
      description: >
        Without an Authorization header the token is anonymous: it can create a
        user (POST /user) and read public settings only. With
        `Authorization: Bearer <credential>` (the credential POST /user
        returned) the token is bound to that user, which user and chat session
        routes require. Credentials last 30 days, are rotated daily, and are
        revoked if a superseded one is reused; when the response includes a
        new `credential`, the client must replace its stored one.
      operationId: get_public_token
      parameters:
        - name: Authorization
          in: header
          required: false
          description: "Optional `Bearer <credential>` from POST /user"
          schema:
            type: string
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  credential:
                    type: string
                    description: Present when the credential was rotated; replaces the stored one
        "401":
          description: The credential is invalid, expired, revoked or its user no longer exists; create a new user
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${userFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /user:
    <<: *commonOptionsPOST
    post:
      tags:
        - User
      summary: Create a new user (guest/student)
      operationId: create_user
      security:
        - userAuthorizer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: ["student", "admin"]
                  description: Ignored; new users are always 'student' guests
                display_name:
                  type: string
                  maxLength: 64
                  description: Optional display name; trimmed and cut to 64 characters
      responses:
        "200":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  credential:
                    type: string
                    description: >
                      30-day secret for this user. Keep it with userId and send
                      it to GET /user/publicToken to get access tokens bound to
                      this user; that endpoint may return a rotated replacement.
                  role:
                    type: string
                    enum: ["student", "admin"]
                  email:
                    type: string
                    nullable: true
                    description: Always null; guests are created without an address
                  display_name:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  last_seen_at:
                    type: string
                    format: date-time
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${userFunction.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

