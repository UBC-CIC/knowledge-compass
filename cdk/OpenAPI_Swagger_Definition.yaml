      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                model_id and invoke_target are not accepted. The server looks
                them up in Amazon Bedrock for the chosen provider.
              required: [name, provider, dimensions]
              properties:
                name:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{2,62}$"
                  example: titan-v2-1024
                provider:
                  { type: string, enum: [cohere_v3, titan_v2, cohere_v4] }
                dimensions:
                  type: integer
                  description: Must be one of the provider's supported dimensions
                version: { type: string, maxLength: 32, default: "1" }
                price_per_1m_tokens:
                  { type: number, minimum: 0, nullable: true }
                eol_date: { type: string, format: date, nullable: true }
                min_score:
                  { type: number, minimum: 0, maximum: 1, nullable: true }
                split_threshold:
                  { type: number, minimum: 0, maximum: 1, nullable: true }
                settings:
                  type: object
                  additionalProperties: false
                  properties:
                    batch_size: { type: integer, minimum: 1, maximum: 256 }
                    max_chars: { type: integer, minimum: 100, maximum: 50000 }
                    concurrency: { type: integer, minimum: 1, maximum: 32 }
                    normalize: { type: boolean }
      responses:
        "201":
          description: Space registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  status: { type: string, enum: [building] }
                  index_name: { type: string }
        "400":
          description: Invalid field (the error names it)
        "401":
          description: Unauthorized
        "409":
          description: A space with this name already exists
        "500":
          description: Internal Server Error
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaKnowledgeBase.Arn}/invocations
        passthroughBehavior: "when_no_match"
        httpMethod: POST
        type: aws_proxy

  /admin/embedding-spaces/{id}/jobs:
